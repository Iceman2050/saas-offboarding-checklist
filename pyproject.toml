[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-offboarding-checklist"
version = "1.0.0"
description = "Generate an ordered SaaS access-revocation runbook for departing employees"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["offboarding*"]
